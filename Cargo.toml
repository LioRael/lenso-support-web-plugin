[package]
name = "lenso-support-web-plugin"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/LioRael/lenso-support-web-plugin"
description = "Removable Support Agent Workspace for a Lenso Support application."
publish = true

[package.metadata.lenso]
plugin-id = "lenso.support.web"
root-slot = "web"

[dependencies]
futures = "0.3"
lenso = { version = "0.5.0" }
lenso-auth-sdk = { version = "0.2.1" }
lenso-capability-auth = { version = "0.1.2" }
lenso-capability-http-endpoint = { version = "0.2.7" }
lenso-capability-support-case = { version = "0.1.0" }
lenso-kernel = { version = "0.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
lenso-app-plan = { version = "0.3.0" }
lenso-native-adapter = { version = "0.3.0" }
lenso-runner = { version = "0.2.0" }
time = "0.3"
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
